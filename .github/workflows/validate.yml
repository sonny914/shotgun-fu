name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_INSTALL_DIR: ${{ github.workspace }}/../godot-toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../godot-toolchain
          key: godot-${{ runner.os }}-${{ hashFiles('tools/godot-version.env') }}
      - name: Install pinned Godot
        run: tools/install_godot.sh
      - name: Full headless validation
        run: tools/validate.sh --full
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-logs
          path: .godot/validate-logs/
          if-no-files-found: ignore
